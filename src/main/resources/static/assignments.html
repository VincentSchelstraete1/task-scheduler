<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignments</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f9fc;
      margin: 0;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      color: #0077ff;
    }

    .course-box {
      background: white;
      margin: 1.5rem 0;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .course-box h2 {
      margin-top: 0;
      color: #222;
    }

    .assignment-card {
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      transition: box-shadow 0.2s ease-in-out;
    }

    .assignment-card:hover {
      box-shadow: 0 4px 10px rgba(60, 64, 67, 0.3);
    }

    .assignment-title {
      font-weight: bold;
      font-size: 1.1rem;
      color: #333;
    }

    .assignment-details {
      color: #555;
      margin-top: 0.25rem;
      font-size: 0.95rem;
    }

    .assignment-card button {
      margin-top: 0.5rem;
      background-color: #0077ff;
      color: white;
      border: none;
      padding: 0.4rem 0.75rem;
      border-radius: 5px;
      cursor: pointer;
    }

    .assignment-card button:hover {
      background-color: #005fd1;
    }

    .urgency-badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.2rem 0.6rem;
      font-size: 0.8rem;
      border-radius: 20px;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
<h1>My Assignments</h1>
<div id="assignment-container"></div>

<script>
  fetch('/assignments')
          .then(response => response.json())
          .then(data => {
            const container = document.getElementById('assignment-container');

            for (const courseName in data) {
              const courseBox = document.createElement('div');
              courseBox.classList.add('course-box');

              const title = document.createElement('h2');
              title.textContent = courseName;
              courseBox.appendChild(title);

              data[courseName].forEach(task => {
                const formattedUrgency = task.urgency
                        .replace('_', ' ')
                        .toLowerCase()
                        .replace(/\b\w/g, c => c.toUpperCase());

                let backgroundColor, borderColor;
                switch (task.urgency) {
                  case 'URGENT':
                    backgroundColor = '#ffe5e5';
                    borderColor = '#f44336';
                    break;
                  case 'SOMEWHAT_URGENT':
                    backgroundColor = '#fff5e0';
                    borderColor = '#ff9800';
                    break;
                  case 'NOT_URGENT':
                  default:
                    backgroundColor = '#f0fff0';
                    borderColor = '#4caf50';
                    break;
                }

                const assignmentDiv = document.createElement('div');
                assignmentDiv.className = 'assignment-card';
                assignmentDiv.style.backgroundColor = backgroundColor;
                assignmentDiv.style.borderLeft = `6px solid ${borderColor}`;

                assignmentDiv.innerHTML = `
            <div class="assignment-title">${task.title}</div>
            <div class="assignment-details">
              ${task.description || 'No description'}<br>
              <strong>Due:</strong> ${task.formattedDueDate || 'N/A'}<br>
              <strong>Time Estimate:</strong> ${task.estimatedMinutes || '?'} minutes
            </div>
            <span class="urgency-badge" style="background-color: ${borderColor};">${formattedUrgency}</span><br>
            <button onclick="window.open('${task.alternateLink || '#'}', '_blank')">
              View on Google Classroom
            </button>
          `;

                courseBox.appendChild(assignmentDiv);
              });

              container.appendChild(courseBox);
            }
          })
          .catch(err => {
            console.error('Error fetching assignments:', err);
          });
</script>
</body>
</html>
